services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides the SQLite DATABASE_URI in .env with the db service.
      DATABASE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      # Only the host's nginx reaches the app.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - media:/app/public/media
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  # Uploads from the panel; starts with the images in the repository.
  media:
